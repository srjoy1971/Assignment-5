<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <!-- tailwind + daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gsttic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?afamily=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div
            class="navbar bg-base-100 shadow-sm max-w-[1200px] mx-auto flex flex-col md:flex-row md:justify-between gap-3 p-3">
            <div class="flex items-center gap-2">
                <img src="./image/Group.png" alt="" class="w-8 h-8">
                <p class="text-lg md:text-xl font-bold">GitHub Issues Tracker</p>
            </div>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" placeholder="Search" class="searchBox input input-bordered w-full md:w-auto" />
                <button class="searchbtn btn btn-primary">
                    Search
                </button>
            </div>
        </div>
    </header>


    <section id="" class="max-w-[1200px] bg-base-100 shadow-sm mx-auto mt-10 p-3 px-4 rounded-lg ">
        <div class="gap-3 flex">
            <button onclick="loadIssues(); toggleStyle('all-container')" id="all-container"
                class="btn btn-outline btn-sm">All</button>
            <button onclick="openIssues(); toggleStyle('btn-open')" id="btn-open"
                class="btn btn-outline btn-sm">Open</button>
            <button onclick="closedIssues(); toggleStyle('btn-closed')" id="btn-closed"
                class="btn btn-outline btn-sm">Closed</button>
        </div>
        <div id="loader" class="text-center my-4 hidden">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
    </section>
    <section class="max-w-[1200px] bg-base-100 shadow-sm mx-auto rounded-lg flex flex-col md:flex-row md:items-center md:justify-between mt-4 p-3 gap-4">

  <div class="flex items-center gap-3">
    <img src="./image/Aperture.png" alt="Logo" class="w-10 h-10">
    <div>
      <p id="all-count" class="font-bold text-lg">0 Issues</p>
      <p class="text-sm text-gray-500">Track and manage your project issues</p>
    </div>
  </div>

  <div class="flex gap-4 justify-start md:justify-end">
    
    <div class="flex gap-1 items-center">
      <img src="./image/Open-Status.png" alt="Open" class="w-5 h-5">
      <p class="font-semibold">Open</p>
    </div>

    <div class="flex gap-1 items-center">
      <img src="./image/Closed- Status .png" alt="Closed" class="w-5 h-5">
      <p class="font-semibold">Closed</p>
    </div>

  </div>
  
</section>

    <section id="issue-container"
        class="issue-container max-w-[1200px] bg-base-100 mx-auto  p-3 rounded-lg grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    </section>

    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box w-11/12 max-w-2xl p-5 sm:p-6 mr-5">
        
        <h3 id="modal-title" class="text-xl sm:text-2xl font-bold mb-2 break-words"></h3>

        <div class="flex flex-wrap items-center gap-2 mb-4">
            <span id="modal-status" class="badge badge-success text-white"></span>
            <span id="modal-meta" class="text-xs sm:text-sm text-gray-500"></span>
        </div>

        <div id="modal-labels" class="flex flex-wrap gap-2 mb-4"></div>

        <p id="modal-description" class="py-4 text-sm sm:text-base text-gray-600 border-t border-gray-100 leading-relaxed"></p>

        <div class="bg-gray-50 p-4 sm:p-6 rounded-xl flex flex-col sm:flex-row justify-between gap-4 mt-4">
            <div>
                <p class="text-[10px] sm:text-xs text-gray-400 uppercase font-bold mb-1">Assignee:</p>
                <p id="modal-assignee" class="font-bold text-gray-800 text-sm sm:text-base"></p>
            </div>
            
            <div class="sm:text-right">
                <p class="text-[10px] sm:text-xs text-gray-400 uppercase font-bold mb-1 bg-amber-400">Priority:</p>
                <span id="modal-priority" class="badge badge-md sm:badge-lg font-bold"></span>
            </div>
        </div>

        <div class="modal-action">
            <form method="dialog" class="w-full sm:w-auto">
                <button class="btn btn-primary w-full sm:w-auto px-8">Close</button>
            </form>
        </div>
    </div>
</dialog>



</body>
<script src="./script/issues.js"></script>

</html>
