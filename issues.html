<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <!-- tailwind + daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gsttic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?afamily=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="navbar bg-base-100 shadow-sm justify-between">
            <div class="flex items-center gap-2">
                <img src="./image/Group.png" alt="">
                <p class="text-xl font-bold">GitHub Issues Tracker</p>
            </div>
            <div class="flex gap-2">
                <input type="text" placeholder="Search" class="searchBox input input-bordered w-24 md:w-auto" />
                <button class="searchbtn btn btn-primary">Search</button>
            </div>
        </div>
    </header>


    <section id="" class="max-w-[1200px] bg-base-100 shadow-sm mx-auto mt-10 p-3 px-4 rounded-lg ">
        <div class="gap-3 flex bg">
            <button onclick="loadIssues()" id="all-container" class="btn btn-outline btn-sm">All</button>
            <button onclick="openIssues()" id="btn-open" class="btn btn-outline btn-sm">Open</button>
            <button onclick="closedIssues()" id="btn-closed" class="btn btn-outline btn-sm">Closed</button>
        </div>
        <div id="loader" class="text-center my-4 hidden">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
    </section>
    <section id=""
        class="max-w-[1200px] bg-base-100 shadow-sm mx-auto rounded-lg flex items-center justify-between mt-4 p-1 px-3">
        <div class="flex justify-between items-center gap-3">
            <img src="./image/Aperture.png" alt="">
            <div>
                <p id="all-count" class="font-bold text-lg">0 Issues</p>
                <p class="text-sm text-gray-500">Track and manage your project issues</p>
            </div>
        </div>
        <div class="flex gap-3">
            <div class="flex gap-1 items-center">
                <img src="./image/Open-Status.png" alt="">
                <p class="font-semibold">Open</p>
            </div>
            <div class="flex gap-1 items-center">
                <img src="./image/Closed- Status .png" alt="">
                <p class="font-semibold">Closed</p>
            </div>
        </div>
    </section>

    <section id="issue-container"
        class="issue-container max-w-[1200px] bg-base-100 mx-auto  p-3 rounded-lg grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    </section>

    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box max-w-2xl">
            <h3 id="modal-title" class="text-2xl font-bold mb-2"></h3>

            <div class="flex items-center gap-2 mb-4">
                <span id="modal-status" class="badge badge-success text-white"></span>
                <span id="modal-meta" class="text-sm text-gray-500"></span>
            </div>

            <div id="modal-labels" class="flex gap-2 mb-4"></div>

            <p id="modal-description" class="py-4 text-gray-600 border-t border-gray-100"></p>

            <div class="bg-gray-50 p-6 rounded-xl flex justify-between items-center mt-4">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold mb-1">Assignee:</p>
                    <p id="modal-assignee" class="font-bold text-gray-800"></p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400 uppercase font-bold mb-1 ml-28">Priority:</p>
                    <span id="modal-priority" class="badge badge-lg font-bold bg-red-300 "></span>
                </div>
            </div>

            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-primary px-8">Close</button>
                </form>
            </div>
        </div>
    </dialog>



</body>
<script src="./script/issues.js"></script>

</html>
